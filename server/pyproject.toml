[project]
name = "prodbat-server"
version = "0.0.1"
description = "Simple analytics and monitoring for solo founders: visitors, sources, payments, and what is broken."
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "jinja2>=3.1.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prodbat_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

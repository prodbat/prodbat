[project]
name = "prodbat"
version = "0.0.1"
description = "Report server errors, scheduled jobs and Stripe events to Prodbat. No dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://prodbat.com"
Repository = "https://github.com/prodbat/prodbat"
Source = "https://github.com/prodbat/prodbat/tree/main/packages/python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prodbat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
